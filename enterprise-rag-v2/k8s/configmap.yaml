apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-rag-config
  namespace: enterprise-rag
data:
  # --- Database ---
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/ragdb"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_PRE_PING: "true"
  DB_POOL_RECYCLE: "3600"

  # --- Redis ---
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"

  # --- Qdrant ---
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "documents"
  QDRANT_VECTOR_SIZE: "512"

  # --- LLM ---
  OPENAI_BASE_URL: "https://api.deepseek.com/v1"
  OPENAI_MODEL: "deepseek-chat"

  # --- Embedding ---
  EMBEDDING_MODEL_PATH: "/opt/models/bge-small-zh-v1.5"
  HF_ENDPOINT: "https://hf-mirror.com"

  # --- Logging ---
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_FILE_PATH: "/app/shared/logs/app.log"
  LOG_MAX_FILE_SIZE: "10485760"
  LOG_BACKUP_COUNT: "5"
  LOG_MAX_AGE_DAYS: "7"
  LOG_MAX_TOTAL_BYTES: "2147483648"

  # --- App ---
  APP_NAME: "Enterprise RAG System"
  APP_VERSION: "latest"
  ENVIRONMENT: "production"
  DEBUG: "false"
  CSRF_ENABLED: "true"
  UPLOAD_DIR: "/app/uploads"
