apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-worker
  namespace: enterprise-rag
  labels:
    app: enterprise-rag
    tier: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: enterprise-rag
      tier: worker
  template:
    metadata:
      labels:
        app: enterprise-rag
        tier: worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: worker
          image: enterprise-rag-v2:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - "-A"
            - infrastructure.queue.celery_app.celery_app
            - worker
            - "-l"
            - INFO
            - "--concurrency=4"
            - "-Q"
            - "documents_high,chat_async,celery"
          env:
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
          envFrom:
            - configMapRef:
                name: enterprise-rag-config
            - secretRef:
                name: enterprise-rag-secret
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: shared
              mountPath: /app/shared
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: enterprise-rag-uploads
        - name: shared
          persistentVolumeClaim:
            claimName: enterprise-rag-shared
