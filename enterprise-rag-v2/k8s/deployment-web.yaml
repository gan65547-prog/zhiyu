apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-web
  namespace: enterprise-rag
  labels:
    app: enterprise-rag
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: enterprise-rag
      tier: web
  template:
    metadata:
      labels:
        app: enterprise-rag
        tier: web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis"; sleep 2; done
        - name: run-migrations
          image: enterprise-rag-v2:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: enterprise-rag-config
            - secretRef:
                name: enterprise-rag-secret
      containers:
        - name: web
          image: enterprise-rag-v2:latest
          imagePullPolicy: IfNotPresent
          command:
            - "/app/startup/run-app.sh"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: enterprise-rag-config
            - secretRef:
                name: enterprise-rag-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: shared
              mountPath: /app/shared
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: enterprise-rag-uploads
        - name: shared
          persistentVolumeClaim:
            claimName: enterprise-rag-shared
