services:
  # ========== PostgreSQL 数据库 ==========
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Qdrant 向量数据库（独立部署）==========
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ========== Web 应用 ==========
  web:
    image: enterprise-rag-v2:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/app/shared/models/bge-small-zh-v1.5}
      DEBUG: "false"

      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CSRF_SECRET: ${CSRF_SECRET:-csrf-secure-random-key-for-production-use-only}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DISABLE_DEFAULT_ADMIN_LOGIN: ${DISABLE_DEFAULT_ADMIN_LOGIN:-true}

      # /internal/admin（ops-center）；与 ops-center 的 INTERNAL_API_KEY 一致；未设置 .env 时使用与 ops-center 示例相同的占位密钥
      INTERNAL_API_KEYS: ${INTERNAL_API_KEYS:-["change-me-same-as-business"]}
      INTERNAL_IP_WHITELIST: ${INTERNAL_IP_WHITELIST:-["*"]}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
      - ./runtime/uploads:/app/uploads
      - ./shared:/app/shared
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  worker:
    image: enterprise-rag-v2:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "infrastructure.queue.celery_app.celery_app", "worker", "-l", "INFO", "--pool=solo", "-Q", "documents_high,chat_async,celery"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/ragdb
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/app/shared/models/bge-small-zh-v1.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      LOG_FILE_PATH: /app/shared/logs/app.log
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-7}
      LOG_MAX_TOTAL_BYTES: ${LOG_MAX_TOTAL_BYTES:-2147483648}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./runtime:/app/runtime
      - ./runtime/uploads:/app/uploads
      - ./shared:/app/shared
    restart: unless-stopped

  beat:
    image: enterprise-rag-v2:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "infrastructure.queue.celery_app.celery_app", "beat", "-l", "INFO"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/app/shared/models/bge-small-zh-v1.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./runtime:/app/runtime
      - ./runtime/uploads:/app/uploads
      - ./shared:/app/shared
    restart: unless-stopped

  # ========== Celery Flower 任务监控（可选）==========
  flower:
    image: mher/flower:2.0.1
    command: [
      "celery", "-A", "infrastructure.queue.celery_app.celery_app", "flower",
      "--port=5555",
    ]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - flower
    restart: unless-stopped

  # ========== Nginx 反向代理（生产环境可选）==========
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - certbot_conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - production

  # ========== OpenClaw 消息网关 ==========
  # openclaw:
  #   build:
  #     context: ./openclaw
  #     dockerfile: Dockerfile
  #   environment:
  #     FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  #     FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  #     INTEGRATION_SECRET: ${INTEGRATION_SECRET:-change-this-in-production}
  #     API_URL: http://web:8000
  #   depends_on:
  #     - web
  #   ports:
  #     - "3000:3000"
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  certbot_conf:
