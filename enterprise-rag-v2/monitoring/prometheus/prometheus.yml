# Prometheus 配置 - 采集应用指标
# 部署: 与应用同 docker network，自动发现服务

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# 告警规则文件
rule_files:
  # - "alerts/*.yml"

scrape_configs:
  - job_name: "enterprise-rag"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - "web:8000"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "$1"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
