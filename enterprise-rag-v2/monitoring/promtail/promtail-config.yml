# Promtail 配置 - 日志采集发送到 Loki
# 部署：与应用同主机运行，采集容器日志

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 采集 Docker 容器日志（JSON 文件驱动）
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"

  # 采集应用日志文件
  - job_name: app-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: enterprise-rag
          __path__: /app/shared/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            module: module
            message: message
            timestamp: timestamp
      - labels:
          level:
          module:
