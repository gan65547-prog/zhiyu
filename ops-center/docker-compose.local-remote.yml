# 本地构建并运行 ops-center，上游业务在 your-business-host.example
#
# 准备：
#   1. cp .env.local-remote.example .env  （填好 INTERNAL_API_KEY，与 102 上业务一致）
#   2. your-business-host.example 上业务已启动且可从本机访问：curl -s http://your-business-host.example:8000/health/live
#   3. 102 上 INTERNAL_IP_WHITELIST 含你本机 IP 或 "*"
#
# 启动：
#   docker compose -f docker-compose.local-remote.yml up -d --build
#
# 验证：
#   浏览器 http://127.0.0.1:8081  登录 admin / bootstrap 密码
#   GET http://127.0.0.1:8081/api/v1/operations/health/upstream （需先登录拿 Bearer）
#
version: "3.9"

services:
  ops-center:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8081:8081"
