version: "3.9"

# 可选：与 ops-center 同网段的 PostgreSQL（设置 OPS_DATABASE_URL=postgresql://ops:ops@postgres-ops:5432/ops_center）
#  services:
#    postgres-ops:
#      image: postgres:16-alpine
#      environment:
#        POSTGRES_USER: ops
#        POSTGRES_PASSWORD: ops
#        POSTGRES_DB: ops_center
#      ports:
#        - "5433:5432"

services:
  ops-center:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Linux 环境下如未内置 host.docker.internal，可取消注释：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; resp=urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3); sys.exit(0 if resp.getcode()==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8081:8081"
    restart: unless-stopped
